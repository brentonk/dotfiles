# vim:ft=kitty
## Theme collection "flexoki-light". nvim counterpart is flexoki dawn (see
## COLORS.lua registry).
## name: Flexoki Light
## author: Steph Ango
## upstream: https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/kitty/Flexoki%20Light.conf
## blurb: An inky color scheme for prose and code (https://stephango.com/flexoki)

foreground                      #100f0f
background                      #fffcf0
selection_foreground            #fffcf0
selection_background            #100f0f

cursor                          #100f0f
cursor_text_color               #fffcf0

#: black
color0                          #100f0f
color8                          #b7b5ac

#: red
color1                          #af3029
color9                          #d14d41

#: green
color2                          #66800b
color10                         #879a39

#: yellow
color3                          #ad8301
color11                         #d0a215

#: blue
color4                          #205ea6
color12                         #4385be

#: magenta
color5                          #a02f6f
color13                         #ce5d97

#: cyan
color6                          #24837b
color14                         #3aa99f

#: white
color7                          #6f6e69
color15                         #cecdc3

#: --- Additions beyond the iTerm2-Color-Schemes port ---
#: Tab bar / borders / url, using official Flexoki light UI shades
#: (bg-2 #f2f0e5, ui-2 #dad8ce, tx-2 #6f6e69)
url_color                       #205ea6
active_border_color             #6f6e69
inactive_border_color           #dad8ce
bell_border_color               #ad8301
active_tab_foreground           #100f0f
active_tab_background           #fffcf0
inactive_tab_foreground         #6f6e69
inactive_tab_background         #f2f0e5
tab_bar_background              #f2f0e5
