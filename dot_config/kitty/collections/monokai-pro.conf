# vim:ft=kitty
## Theme collection "monokai-pro". nvim counterpart: monokai_pro (see
## COLORS.lua registry). Constructed from monokai.nvim's pro palette table
## (no terminal port exists), using the same ANSI slot mapping as the classic
## Monokai port: 1=pink 2=green 3=yellow 4=aqua 5=orange 6=purple.

foreground                      #fff1f3
background                      #26292c
selection_foreground            #fff1f3
selection_background            #333842

cursor                          #fff1f3
cursor_text_color               #26292c

# black
color0                          #26292c
color8                          #72696a

# red (pink / red)
color1                          #ff6188
color9                          #fd6883

# green
color2                          #a9dc76
color10                         #a9dc76

# yellow
color3                          #ffd866
color11                         #ffd866

# blue (aqua)
color4                          #78dce8
color12                         #78dce8

# magenta (orange, as in the classic Monokai port)
color5                          #fc9867
color13                         #fc9867

# cyan (purple, as in the classic Monokai port)
color6                          #ab9df2
color14                         #ab9df2

# white
color7                          #b1b1b1
color15                         #fff1f3
