# vim:ft=kitty
## Theme collection "monokai-ristretto". nvim counterpart: monokai_ristretto
## (see COLORS.lua registry). Constructed from monokai.nvim's ristretto
## palette table (no terminal port exists), using the same ANSI slot mapping
## as the classic Monokai port: 1=pink 2=green 3=yellow 4=aqua 5=orange
## 6=purple.

foreground                      #fff1f3
background                      #2c2525
selection_foreground            #fff1f3
selection_background            #403838

cursor                          #fff1f3
cursor_text_color               #2c2525

# black
color0                          #2c2525
color8                          #72696a

# red (pink / red)
color1                          #ff6188
color9                          #fd6883

# green
color2                          #adda78
color10                         #adda78

# yellow
color3                          #f9cc6c
color11                         #f9cc6c

# blue (aqua)
color4                          #85dacc
color12                         #85dacc

# magenta (orange, as in the classic Monokai port)
color5                          #f38d70
color13                         #f38d70

# cyan (purple, as in the classic Monokai port)
color6                          #a8a9eb
color14                         #a8a9eb

# white
color7                          #c3b7b8
color15                         #fff1f3
